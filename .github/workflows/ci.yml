name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The DataSQRL organization ruleset requires a status check named "build" on main.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # ubuntu-latest ships shellcheck, so the lint step always runs here.
      - run: .github/check-plugin.sh
