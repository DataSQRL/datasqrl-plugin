name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The DataSQRL organization ruleset requires a status check named "build" on main.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ubuntu-latest ships shellcheck, so the lint step always runs here.
      - run: .github/check-plugin.sh
      # The launcher tests run scripts/datasqrl-agent.sh against a fake `docker`, so they need no
      # Docker and no network. Ubuntu's system Python refuses a plain pip install, hence the venv.
      - name: Launcher tests
        run: |
          python3 -m venv /tmp/test-venv
          /tmp/test-venv/bin/pip install --quiet pytest==9.1.1
          /tmp/test-venv/bin/python -m pytest tests -q
